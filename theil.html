ody><div class="hdr"><button class="bk">‹</button><div class="ttl">Transfer</div><div class="sp"></div></div><div class="wr"><div class="cd c1"><div class="bx"><div class="lb">Investment Wallet</div><div class="vl">0</div></div><div class="ar">⇨</div><div class="bx"><div class="lb">Profit Wallet</div><div class="vl">0</div></div></div><div class="cd c2"><div class="bx"><div class="lb">Investment Wallet</div><div class="vl">0</div></div><div class="ar">⇨</div><div class="bx"><div class="lb">Profit Wallet</div><div class="vl">0</div></div></div><div class="frm"><input type="text" class="ip" placeholder="Amount"><div class="pw"><input type="password" class="ip" placeholder="Security PIN" id="pin"><button class="ey" onclick="var p=document.getElementById('pin'),e=document.getElementById('eic');if(p.type==='password'){p.type='text';e.innerHTML='<path d=&quot;M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24&quot;/><line x1=&quot;1&quot; y1=&quot;1&quot; x2=&quot;23&quot; y2=&quot;23&quot;/>'}else{p.type='password';e.innerHTML='<path d=&quot;M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z&quot;/><circle cx=&quot;12&quot; cy=&quot;12&quot; r=&quot;3&quot;/>'}"><svg id="eic" viewBox="0 0 24 24"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg></button></div><button class="bt">Confirm</button></div></div></body></html>
