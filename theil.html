<!DOCTYPE html><html lang="ar" dir="rtl"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>تحويل</title><style>*{margin:0;padding:0;box-sizing:border-box;font-family:'Tahoma',Arial,sans-serif}body{background:#1a120b;min-height:100vh;color:#fff;padding:20px;max-width:420px;margin:0 auto}.hdr{display:flex;align-items:center;justify-content:space-between;padding:10px 5px 25px;position:relative}.bk{font-size:24px;color:#fff;cursor:pointer;background:none;border:none}.ttl{position:absolute;left:50%;transform:translateX(-50%);font-size:18px;color:#fff}.sp{width:24px}.cd{border-radius:18px;padding:22px 20px;margin-bottom:15px;display:flex;align-items:center;justify-content:space-between}.c1{background:#e8a33d}.c2{background:#3d2c1e}.bx{text-align:center;flex:1}.lb{font-size:15px;color:#fff;margin-bottom:6px}.vl{font-size:18px;color:#fff;font-weight:bold}.ar{font-size:26px;color:#fff;font-weight:bold}.frm{background:#3d2c1e;border-radius:18px;padding:20px;margin-top:10px}.ip{background:#5a4028;border:none;border-radius:12px;padding:16px 20px;width:100%;color:#fff;font-size:15px;margin-bottom:14px;text-align:right;direction:rtl;position:relative}.ip::placeholder{color:#d4c4b0}.pw{position:relative}.pw input{padding-left:45px}.ey{position:absolute;left:15px;top:50%;transform:translateY(-50%);color:#d4c4b0;font-size:18px;cursor:pointer;background:none;border:none}.bt{background:#e8a33d;border:none;border-radius:12px;padding:16px;width:100%;color:#fff;font-size:17px;font-weight:bold;cursor:pointer;margin-top:6px}.bt:hover{background:#d4922e}</style></head><body><div class="hdr"><button class="bk">‹</button><div class="ttl">تحويل</div><div class="sp"></div></div><div class="cd c1"><div class="bx"><div class="lb">محفظة استثمارية</div><div class="vl">0</div></div><div class="ar">⇨</div><div class="bx"><div class="lb">محفظة مربحة</div><div class="vl">0</div></div></div><div class="cd c2"><div class="bx"><div class="lb">محفظة استثمارية</div><div class="vl">0</div></div><div class="ar">⇨</div><div class="bx"><div class="lb">محفظة مربحة</div><div class="vl">0</div></div></div><div class="frm"><input type="text" class="ip" placeholder="كمية"><div class="pw"><input type="password" class="ip" placeholder="رقم التعريف الشخصى الأمنى" id="pin"><button class="ey" onclick="var p=document.getElementById('pin');p.type=p.type==='password'?'text':'password'">👁</button></div><button class="bt">نعم</button></div></body></html>
