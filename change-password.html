<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#1a0d2e">
<title>CREFTX - تغيير كلمة السر</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;font-family:'Segoe UI','Tahoma',sans-serif}
html,body{width:100%;overflow-x:hidden}
body{background:#1a0d2e;color:#e9d5ff;min-height:100vh;position:relative;font-size:13px;display:flex;align-items:center;justify-content:center;padding:16px}
.bg-pattern{position:fixed;inset:0;background:radial-gradient(circle at 20% 30%,rgba(168,85,247,.12),transparent 40%),radial-gradient(circle at 80% 70%,rgba(139,92,246,.10),transparent 40%);pointer-events:none;z-index:0}
.card{width:100%;max-width:420px;background:linear-gradient(145deg,#2a1a4a,#1f1236);border:1px solid #6d28d9;border-radius:18px;padding:28px 22px;box-shadow:0 8px 32px rgba(139,92,246,.25);position:relative;z-index:1}
.logo{width:70px;height:70px;margin:0 auto 14px;border-radius:50%;background:linear-gradient(145deg,#a855f7,#7c3aed);border:2px solid #c4b5fd;display:flex;align-items:center;justify-content:center;font-size:26px;font-weight:800;color:#fff;box-shadow:0 4px 16px rgba(168,85,247,.5)}
.title{text-align:center;font-size:20px;font-weight:700;margin-bottom:5px;color:#f5f3ff}
.sub{text-align:center;font-size:12px;color:#c4b5fd;margin-bottom:22px}
.field{margin-bottom:14px}
.field label{display:block;font-size:12px;color:#c4b5fd;margin-bottom:6px;font-weight:500}
.pw-wrap{position:relative}
.pw-input{width:100%;background:#160a26;border:1px solid #6d28d9;border-radius:10px;padding:12px 14px;color:#f5f3ff;font-size:15px;outline:none;letter-spacing:2px;text-align:center;transition:.2s}
.pw-input:focus{border-color:#a855f7;box-shadow:0 0 0 3px rgba(168,85,247,.2)}
.pw-toggle{position:absolute;left:10px;top:50%;transform:translateY(-50%);background:none;border:none;color:#c4b5fd;cursor:pointer;padding:5px;font-size:11px}
.btn{width:100%;background:linear-gradient(145deg,#a855f7,#7c3aed);border:none;border-radius:10px;padding:12px;color:#fff;font-size:15px;font-weight:700;cursor:pointer;transition:.2s;box-shadow:0 4px 12px rgba(168,85,247,.4);margin-top:6px}
.btn:hover{transform:translateY(-1px);box-shadow:0 6px 16px rgba(168,85,247,.5)}
.btn:disabled{opacity:.6;cursor:not-allowed;transform:none}
.msg{border-radius:8px;padding:10px;font-size:12px;text-align:center;margin-bottom:12px;display:none}
.msg.show{display:block}
.msg.err{background:rgba(239,68,68,.15);border:1px solid #ef4444;color:#fca5a5}
.msg.ok{background:rgba(34,197,94,.15);border:1px solid #22c55e;color:#86efac}
.msg.info{background:rgba(168,85,247,.12);border:1px solid #a855f7;color:#c4b5fd}
.foot{text-align:center;margin-top:16px;font-size:10px;color:#8b5cf6}
.current-pw{background:#160a26;border:1px dashed #6d28d9;border-radius:8px;padding:9px;text-align:center;font-size:12px;color:#c4b5fd;margin-bottom:16px}
.current-pw b{color:#f5f3ff;letter-spacing:2px;font-size:14px}
</style>
</head>
<body>
<div class="bg-pattern"></div>
<div class="card">
  <div class="logo">🔒</div>
  <div class="title">تغيير كلمة السر</div>
  <div class="sub">لوحة تحكم CREFTX</div>

  <div id="currentPwBox" class="current-pw">كلمة السر الحالية: <b id="currentPw">...</b></div>

  <div id="msg" class="msg"></div>

  <div class="field">
    <label>كلمة السر الحالية</label>
    <div class="pw-wrap">
      <input type="password" class="pw-input" id="oldPw" placeholder="••••••" maxlength="30" autocomplete="off">
      <button type="button" class="pw-toggle" onclick="tog('oldPw')">👁</button>
    </div>
  </div>

  <div class="field">
    <label>كلمة السر الجديدة</label>
    <div class="pw-wrap">
      <input type="password" class="pw-input" id="newPw" placeholder="••••••" maxlength="30" autocomplete="off">
      <button type="button" class="pw-toggle" onclick="tog('newPw')">👁</button>
    </div>
  </div>

  <div class="field">
    <label>تأكيد كلمة السر الجديدة</label>
    <div class="pw-wrap">
      <input type="password" class="pw-input" id="confPw" placeholder="••••••" maxlength="30" autocomplete="off">
      <button type="button" class="pw-toggle" onclick="tog('confPw')">👁</button>
    </div>
  </div>

  <button class="btn" id="saveBtn" onclick="saveNewPw()">حفظ كلمة السر الجديدة</button>

  <div class="foot">CREFTX © Admin Panel</div>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
import { getFirestore, doc, getDoc, setDoc, updateDoc } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";

const firebaseConfig={apiKey:"AIzaSyDQIKQ5swu_XnVtqET0B9EelRKFjr0LXHI",authDomain:"ksksjsh-724f2.firebaseapp.com",projectId:"ksksjsh-724f2",storageBucket:"ksksjsh-724f2.firebasestorage.app",messagingSenderId:"1046924412561",appId:"1:1046924412561:web:1a40834236da75d0d6e130",measurementId:"G-5D3YJQDH8B"};

const app = initializeApp(firebaseConfig);
const db  = getFirestore(app);
const PW_DOC = doc(db, "admin_settings", "login");

const $ = (id) => document.getElementById(id);

function showMsg(type, text){
  const m = $("msg");
  m.className = "msg show " + type;
  m.textContent = text;
}
function hideMsg(){ $("msg").className = "msg"; }

window.tog = (id) => {
  const i = $(id);
  i.type = i.type === "password" ? "text" : "password";
};

async function loadCurrent(){
  try {
    const snap = await getDoc(PW_DOC);
    if (snap.exists() && snap.data().passed){
      $("currentPw").textContent = String(snap.data().passed);
    } else {
      await setDoc(PW_DOC, { passed: "123455" });
      $("currentPw").textContent = "123455";
      showMsg("info", "تم إنشاء كلمة سر افتراضية: 123455");
    }
  } catch(e){
    console.error(e);
    $("currentPw").textContent = "غير متاح";
    showMsg("err", "تعذر تحميل كلمة السر الحالية: " + e.message);
  }
}

window.saveNewPw = async () => {
  hideMsg();
  const oldV  = $("oldPw").value.trim();
  const newV  = $("newPw").value.trim();
  const confV = $("confPw").value.trim();

  if(!oldV || !newV || !confV){
    showMsg("err", "يرجى تعبئة جميع الحقول");
    return;
  }
  if(newV !== confV){
    showMsg("err", "كلمة السر الجديدة وتأكيدها غير متطابقين");
    return;
  }
  if(newV.length < 4){
    showMsg("err", "كلمة السر الجديدة قصيرة جداً (4 أحرف على الأقل)");
    return;
  }

  const btn = $("saveBtn");
  btn.disabled = true;
  btn.textContent = "جاري الحفظ...";

  try {
    const snap = await getDoc(PW_DOC);
    const cur = (snap.exists() && snap.data().passed) ? String(snap.data().passed) : "123455";
    if(oldV !== cur){
      showMsg("err", "كلمة السر الحالية غير صحيحة");
      btn.disabled = false;
      btn.textContent = "حفظ كلمة السر الجديدة";
      return;
    }

    if(snap.exists()){
      await updateDoc(PW_DOC, { passed: newV });
    } else {
      await setDoc(PW_DOC, { passed: newV });
    }

    $("currentPw").textContent = newV;
    $("oldPw").value = "";
    $("newPw").value = "";
    $("confPw").value = "";
    showMsg("ok", "✔ تم تغيير كلمة السر بنجاح");
  } catch(e){
    console.error(e);
    showMsg("err", "خطأ أثناء الحفظ: " + e.message);
  } finally {
    btn.disabled = false;
    btn.textContent = "حفظ كلمة السر الجديدة";
  }
};

loadCurrent();
</script>
</body>
</html>
