lor:rgba(255,255,255,.6)}.invite-img{width:120px;height:auto;z-index:1}.help-title{padding:16px 14px 8px;font-size:16px;font-weight:600;color:#fff;border-right:3px solid #10b981;margin:8px 12px 0;padding-right:10px;line-height:1}.help-list{padding:8px 12px;display:flex;flex-direction:column;gap:10px}.help-item{background:rgba(15,30,25,.5);border:1px solid rgba(45,212,191,.15);border-radius:12px;padding:14px 16px;display:flex;justify-content:space-between;align-items:center;cursor:pointer;font-size:14px;color:#e5e7eb}.help-arrow{width:26px;height:26px;background:#fff;border-radius:50%;display:flex;align-items:center;justify-content:center;flex-shrink:0}.help-arrow svg{width:11px;height:11px;fill:#000;transform:rotate(180deg);margin-right:-1px}.chat-fab{position:fixed;bottom:100px;left:15px;width:46px;height:46px;background:#fff;border-radius:8px;display:flex;align-items:center;justify-content:center;z-index:50;cursor:pointer}.chat-fab svg{width:28px;height:28px}</style></head><body><div class="coin c1"></div><div class="coin c2"></div><div class="coin c3"></div><div class="coin c4"></div><div class=grid3><div class=g-card><div class=g-icon><img src="https://www.krakenint.cc/assets/ZSG62kM1ANDvlZE4gJ.png" alt="فريق"></div><div class=g-label>فريق</div></div><div class=g-card><div class=g-icon><img src="https://www.krakenint.cc/assets/Raf2BfDHF3eVhfqIBD.png" alt="تعاون الوكيل"></div><div class=g-label>تعاون الوكيل</div></div><div class=g-card><div class=g-icon><img src="https://www.krakenint.cc/assets/cVm47lAPuNB9rt8WD3.png" alt="أخبار"></div><div class=g-label>أخبار</div></div></div><div class=invite-card><div class=invite-left><div class=invite-title><div class=invite-play><svg viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg></div>ادعو أصدقاء</div><div class=invite-sub>كسب الدخل</div></div><img class=invite-img src="https://www.krakenint.cc/assets/ZFzfsanJ8wDU4QTZfc.png" alt="ادعو أصدقاء"></div><div class=help-title>مركز المساعدة</div><div class=help-list><div clas
