<!DOCTYPE html>
<html dir="rtl" lang="ar"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>طريقة الإيداع</title><link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Arabic:wght@400;500;600;700&display=swap" rel="stylesheet"><style>*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}body{font-family:'Noto Sans Arabic',sans-serif;background:#1a1210;min-height:100vh;color:#fff;direction:rtl}.container{max-width:640px;margin:0 auto;padding:20px 16px;min-height:100vh}.header{display:flex;align-items:center;justify-content:center;position:relative;padding:8px 0 28px}.back{position:absolute;left:0;top:8px;background:none;border:none;color:#fff;font-size:26px;cursor:pointer;padding:4px 8px}.hist{position:absolute;right:0;top:8px;background:none;border:none;color:#fff;font-size:22px;cursor:pointer;padding:4px 8px}.title{font-size:17px;font-weight:500;letter-spacing:2px}.list{background:#2a1f1c;border-radius:18px;padding:4px 0;overflow:hidden}
.item{display:flex;align-items:center;padding:18px 20px;cursor:pointer;position:relative;transition:background .15s;direction:ltr}
.item:hover{background:rgba(255,255,255,.03)}
.item:not(:last-child)::after{content:"";position:absolute;bottom:0;left:64px;right:20px;height:1px;background:rgba(255,255,255,.06)}
.icon{width:34px;height:34px;border-radius:50%;margin-right:16px;flex-shrink:0;object-fit:cover;background:#000}
.name{flex:1;font-size:15px;font-weight:500;letter-spacing:.5px;font-family:'Courier New',monospace;text-align:left}
.arrow{color:#8a7a75;font-size:20px;font-weight:300}
/* Deposit Page */
.dp{display:none;flex-direction:column;min-height:100vh;direction:ltr}.dp.active{display:flex}
.dp .header{direction:ltr}
.dp-card{background:#2a1f1c;border-radius:16px;padding:18px 16px;margin-top:6px}
.dp-head{display:flex;align-items:center;justify-content:center;gap:10px;margin-bottom:14px;direction:ltr}
.dp-head img{width:38px;height:38px;border-radius:50%;object-fit:cover}
.dp-head span{font-size:17px;font-weight:600;font-family:'Courier New',monospace;letter-spacing:1px}
.qr-box{background:#fff;padding:12px;border-radius:12px;width:190px;height:190px;margin:0 auto;display:flex;align-items:center;justify-content:center}
.qr-box img{width:100%;height:100%}
.lbl{text-align:left;margin:16px 4px 8px;font-size:13px;color:#e8dcd6;direction:ltr}
.addr-box{background:#3a2b26;border:1px dashed #6b5248;border-radius:9px;padding:11px 14px;display:flex;align-items:center;justify-content:space-between;gap:10px;direction:ltr}
.addr{font-family:'Courier New',monospace;font-size:12px;color:#fff;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;flex:1;text-align:left}
.copy{color:#e8a54a;font-size:13px;cursor:pointer;background:none;border:none;font-family:'Noto Sans Arabic',sans-serif;white-space:nowrap}
.done-btn{width:100%;background:linear-gradient(180deg,#e8a54a,#c78030);border:none;color:#fff;font-size:16px;font-weight:600;padding:14px;border-radius:28px;margin-top:16px;cursor:pointer;font-family:'Noto Sans Arabic',sans-serif;letter-spacing:2px}
.note{margin-top:16px;display:flex;align-items:center;gap:8px;direction:ltr}
.note-icon{width:20px;height:20px;border:1.5px solid #fff;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:700}
.note-txt{font-size:14px}
.desc{margin-top:14px;line-height:1.9;font-size:13px;color:#e8dcd6;text-align:left;direction:ltr}
.desc b{display:block;margin-bottom:6px;font-family:'Courier New',monospace;color:#fff}
.toast{position:fixed;bottom:40px;left:50%;transform:translateX(-50%);background:rgba(0,0,0,.85);color:#fff;padding:10px 24px;border-radius:20px;font-size:14px;opacity:0;transition:opacity .3s;pointer-events:none;z-index:99}.toast.show{opacity:1}</style></head><body>

<div class="container" id="listPage">
<div class="header"><button class="hist" title="سجل">🕘</button><div class="title">طريقة الإيداع</div><button class="back" onclick="history.back()">‹</button></div>
<div class="list" id="netList"></div>
</div>

<div class="container dp" id="depositPage">
<div class="header"><button class="hist" title="history">🕘</button><div class="title">Deposit</div><button class="back" onclick="showList()">‹</button></div>
<div class="dp-card">
<div class="dp-head"><img id="dpIcon" src=""><span id="dpName"></span></div>
<div class="qr-box"><img id="dpQr" src=""></div>
<div class="lbl">Deposit Address</div>
<div class="addr-box"><span class="addr" id="dpAddr"></span><button class="copy" onclick="copyAddr()">Copy</button></div>
<button class="done-btn">Deposit Done</button>
</div>
<div class="note"><div class="note-icon">!</div><span class="note-txt">Note</span></div>
<div class="desc"><b id="dpNameDesc"></b><span id="dpDesc"></span></div>
</div>

<div class="toast" id="toast">Copied</div>

<script>
const nets=[
{n:"BEP20-USDT",i:"https://api.awesomeminer-vip.com/static/image/bep20-usdt.webp",a:"0xf486771692fcf0deAA37738013c1BdaB5a1c9e42",net:"BNB Smart Chain",coin:"USDT"},
{n:"TRC20-USDT",i:"https://api.awesomeminer-vip.com/static/image/trc20-usdt.jpg",a:"TXk8rQSAvPvBBNtqSoY6nCfsXWCSSpTVQa",net:"TRON (TRC20)",coin:"USDT"},
{n:"POLYGON-USDC",i:"https://api.awesomeminer-vip.com/static/image/polygon-usdc.webp",a:"0x9c3F2b7e8Ad4C1E5f6B7A8D9E0F1C2B3A4D5E6F7",net:"Polygon",coin:"USDC"},
{n:"TRX",i:"https://api.awesomeminer-vip.com/static/image/trx.webp",a:"TRxLpQmV8sNjKcE4fY2wZ9nBhX7dGtA1Cv",net:"TRON",coin:"TRX"},
{n:"BNB",i:"https://api.awesomeminer-vip.com/static/image/bnb.webp",a:"0xB2a4C1d5E6F7a8B9c0D1e2F3a4B5c6D7e8F9a0B1",net:"BNB Smart Chain",coin:"BNB"},
{n:"BEP20-USDC",i:"https://api.awesomeminer-vip.com/static/image/bep20-usdc.webp",a:"0xC3d5E6F7a8B9c0D1e2F3a4B5c6D7e8F9a0B1c2D3",net:"BNB Smart Chain",coin:"USDC"},
{n:"POLYGON-USDT",i:"https://api.awesomeminer-vip.com/static/image/polygon-usdt.webp",a:"0xD4e6F7a8B9c0D1e2F3a4B5c6D7e8F9a0B1c2D3e4",net:"Polygon",coin:"USDT"},
{n:"ETH-USDT",i:"https://api.awesomeminer-vip.com/static/image/eth-usdt.webp",a:"0xE5f7a8B9c0D1e2F3a4B5c6D7e8F9a0B1c2D3e4F5",net:"Ethereum (ERC20)",coin:"USDT"},
{n:"ETH-USDC",i:"https://api.awesomeminer-vip.com/static/image/eth-usdc.webp",a:"0xF6a8B9c0D1e2F3a4B5c6D7e8F9a0B1c2D3e4F5a6",net:"Ethereum (ERC20)",coin:"USDC"},
{n:"ETH",i:"https://api.awesomeminer-vip.com/static/image/eth.webp",a:"0xA7B9c0D1e2F3a4B5c6D7e8F9a0B1c2D3e4F5a6B7",net:"Ethereum",coin:"ETH"},
{n:"POLYGON",i:"https://api.awesomeminer-vip.com/static/image/polygon.webp",a:"0xB8c0D1e2F3a4B5c6D7e8F9a0B1c2D3e4F5a6B7c8",net:"Polygon",coin:"MATIC"},
{n:"ETH-PYUSD",i:"https://api.awesomeminer-vip.com/static/image/eth-pyusd.webp",a:"0xC9D1e2F3a4B5c6D7e8F9a0B1c2D3e4F5a6B7c8D9",net:"Ethereum (ERC20)",coin:"PYUSD"}
];
const list=document.getElementById('netList');
nets.forEach((x,idx)=>{const d=document.createElement('div');d.className='item';d.innerHTML=`<img class="icon" src="${x.i}"><span class="name">${x.n}</span><span class="arrow">›</span>`;d.onclick=()=>openDeposit(idx);list.appendChild(d)});
function openDeposit(i){const x=nets[i];document.getElementById('dpIcon').src=x.i;document.getElementById('dpName').textContent=x.n;document.getElementById('dpNameDesc').textContent=x.n;document.getElementById('dpAddr').textContent=x.a.slice(0,26)+'...';document.getElementById('dpAddr').dataset.full=x.a;document.getElementById('dpQr').src='https://api.qrserver.com/v1/create-qr-code/?size=300x300&data='+encodeURIComponent(x.a);document.getElementById('dpDesc').innerHTML=`① Copy the address above or scan the QR code and select the ${x.net} network to deposit ${x.coin}.<br>② After recharge, the amount will arrive within one to ten minutes. If the amount does not arrive for a long time, please refresh the page or contact online customer service.`;document.getElementById('listPage').style.display='none';document.getElementById('depositPage').classList.add('active');window.scrollTo(0,0)}
function showList(){document.getElementById('depositPage').classList.remove('active');document.getElementById('listPage').style.display='block';window.scrollTo(0,0)}
function copyAddr(){const t=document.getElementById('dpAddr').dataset.full;navigator.clipboard&&navigator.clipboard.writeText(t);const ts=document.getElementById('toast');ts.classList.add('show');setTimeout(()=>ts.classList.remove('show'),1500)}
</script>
</body></html>
