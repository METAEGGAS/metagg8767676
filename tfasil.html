<!DOCTYPE html>
<html lang="ar" dir="rtl"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>السجلات المالية</title><style>*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}body{background:#000;color:#fff;font-family:-apple-system,'Segoe UI',Tahoma,Arial,sans-serif;min-height:100vh;overflow:hidden;position:relative}.coin{position:fixed;width:38px;height:38px;border-radius:50%;background:radial-gradient(circle at 30% 30%,#ffe066,#f5b800 60%,#c68b00);box-shadow:0 0 8px rgba(255,200,0,.4);z-index:0}.c1{top:78%;left:8%;transform:rotate(-20deg) scaleY(.35)}.c2{top:63%;right:2%;transform:rotate(15deg) scaleY(.9)}.c3{top:88%;right:12%;transform:rotate(10deg) scaleY(.55)}.header{display:flex;align-items:center;padding:18px 16px;position:relative;z-index:3;background:#0d0d0d;box-shadow:0 4px 12px rgba(0,0,0,.7),0 1px 0 rgba(255,255,255,.04) inset;border-bottom:1px solid #1a1a1a}.back{color:#fff;font-size:26px;background:none;border:none;cursor:pointer;padding:4px 8px;font-weight:300}.title{position:absolute;left:0;right:0;text-align:center;font-size:17px;font-weight:600;pointer-events:none;letter-spacing:.3px}.tabs{display:flex;gap:8px;padding:12px 14px;position:relative;z-index:2}.tab{flex:1;padding:14px 8px;border-radius:14px;background:#141a17;color:#fff;text-align:center;font-size:15px;cursor:pointer;border:1px solid transparent;transition:.25s}.tab.active{background:#2bc48a;color:#0a1a12;font-weight:600}.box{margin:8px 14px;border:1px solid #2bc48a;border-radius:14px;height:420px;position:relative;overflow:hidden;background:#000;z-index:2}.filter{position:absolute;top:14px;left:14px;width:22px;height:22px;opacity:.55}.filter svg{width:100%;height:100%;fill:none;stroke:#8aa;stroke-width:2}.content{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;transition:transform .35s ease,opacity .3s ease}.content.slide-out-l{transform:translateX(-100%);opacity:0}.content.slide-out-r{transform:translateX(100%);opacity:0}.content.slide-in-l{transform:translateX(-100%);opacity:0}.content.slide-in-r{transform:translateX(100%);opacity:0}.icon-wrap{width:85px;height:78px;display:flex;align-items:center;justify-content:center}.icon-wrap img{max-width:100%;max-height:100%;object-fit:contain}.empty-text{color:#4a5a55;font-size:14px;margin-top:4px}.loader{width:34px;height:34px;border:3px solid #1a2a24;border-top-color:#2bc48a;border-radius:50%;animation:sp 1s linear infinite}@keyframes sp{to{transform:rotate(360deg)}}</style></head><body>
<div class="coin c1"></div><div class="coin c2"></div><div class="coin c3"></div>
<div class="header"><button class="back" onclick="history.back()">‹</button><div class="title">السجلات المالية</div></div>
<div class="tabs"><div class="tab" data-i="0">الحساب الكمي</div><div class="tab active" data-i="1">أصول الربح</div><div class="tab" data-i="2">الحساب الذكي</div></div>
<div class="box"><div class="filter"><svg viewBox="0 0 24 24"><path d="M3 5h18l-7 8v6l-4 2v-8L3 5z"/></svg></div><div class="content" id="content"><div class="icon-wrap"><img src="https://www.krakenint.cc/assets/avAij0RAIRCHCN_UjN.png" alt=""></div><div class="empty-text">لا يوجد بيانات</div></div></div>
<script>
const tabs=document.querySelectorAll('.tab'),content=document.getElementById('content');let cur=1;
const showIcon=()=>content.innerHTML='<div class="icon-wrap"><img src="https://www.krakenint.cc/assets/avAij0RAIRCHCN_UjN.png" alt=""></div><div class="empty-text">لا يوجد بيانات</div>';
const showLoader=()=>content.innerHTML='<div class="loader"></div>';
tabs.forEach(t=>t.addEventListener('click',()=>{const i=+t.dataset.i;if(i===cur)return;const dir=i>cur?'r':'l';tabs.forEach(x=>x.classList.remove('active'));t.classList.add('active');content.classList.add(dir==='r'?'slide-out-l':'slide-out-r');setTimeout(()=>{showLoader();content.classList.remove('slide-out-l','slide-out-r');content.classList.add(dir==='r'?'slide-in-r':'slide-in-l');requestAnimationFrame(()=>{content.style.transition='none';content.classList.remove('slide-in-l','slide-in-r');requestAnimationFrame(()=>{content.style.transition='';});});setTimeout(showIcon,650);},320);cur=i;}));
</script></body></html>
