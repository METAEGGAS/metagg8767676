<!DOCTYPE html><html lang="ar" dir="rtl"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>مركز الأمن</title><style>*{margin:0;padding:0;box-sizing:border-box;font-family:'Tahoma',Arial,sans-serif}body{background:#0a0a0a;min-height:100vh;color:#fff;max-width:420px;margin:0 auto;overflow-x:hidden;position:relative}.hdr{background:#000;display:flex;align-items:center;justify-content:space-between;padding:18px 20px;position:sticky;top:0;z-index:10}.bk{font-size:26px;color:#fff;cursor:pointer;background:none;border:none;font-weight:bold}.ttl{position:absolute;left:50%;transform:translateX(-50%);font-size:18px;color:#fff;font-weight:600}.sp{width:26px}.wr{padding:20px;position:relative;z-index:2}.pg{display:none}.pg.ac{display:block}.itm{background:transparent;border:1.5px solid #2ecc71;border-radius:14px;padding:20px;margin-bottom:15px;display:flex;align-items:center;justify-content:space-between;cursor:pointer;transition:background .2s}.itm:hover{background:rgba(46,204,113,.05)}.itm-tx{font-size:16px;color:#fff}.itm-ar{color:#2ecc71;font-size:14px}.frm{background:#1a1a1a;border:1.5px solid #2ecc71;border-radius:18px;padding:22px 18px}.ip-w{position:relative;margin-bottom:16px}.ip{background:#2a2a2a;border:none;border-radius:30px;padding:18px 55px 18px 25px;width:100%;color:#fff;font-size:14px;text-align:right;direction:rtl}.ip::placeholder{color:#8a8a8a}.ey{position:absolute;left:20px;top:50%;transform:translateY(-50%);cursor:pointer;background:none;border:none;padding:4px;display:flex}.ey svg{width:22px;height:22px;fill:#fff;stroke:none}.bt{background:#2ecc71;border:none;border-radius:30px;padding:17px;width:100%;color:#fff;font-size:16px;font-weight:bold;cursor:pointer;margin-top:8px}.bt:hover{background:#27b862}.bg{position:fixed;top:0;left:0;right:0;bottom:0;pointer-events:none;z-index:1;max-width:420px;margin:0 auto;overflow:hidden}.cn{position:absolute;font-size:28px;filter:drop-shadow(0 0 8px rgba(255,215,0,.6))}.tr{position:absolute;width:0;height:0;border-left:8px solid transparent;border-right:8px solid transparent}</style></head><body><div class="bg"><div class="cn" style="top:55%;left:8%;transform:rotate(-15deg);font-size:36px">🪙</div><div class="cn" style="top:48%;right:8%;transform:rotate(20deg);font-size:34px">🪙</div><div class="cn" style="top:65%;left:30%;font-size:26px">🪙</div><div class="cn" style="top:72%;right:20%;font-size:30px">🪙</div><div class="cn" style="bottom:5%;left:5%;font-size:28px">🪙</div><div class="cn" style="bottom:3%;right:8%;font-size:28px">🪙</div><div class="tr" style="top:42%;left:20%;border-bottom:12px solid #8a5eb8"></div><div class="tr" style="top:46%;right:35%;border-bottom:12px solid #9b7ec4"></div><div class="tr" style="top:58%;left:25%;border-bottom:12px solid #e88a4a"></div><div class="tr" style="top:63%;right:22%;border-bottom:12px solid #5ac4d4"></div><div class="tr" style="top:75%;left:10%;border-bottom:12px solid #5ac4d4"></div><div class="tr" style="top:70%;right:12%;border-bottom:12px solid #8a5eb8"></div></div><div id="p1" class="pg ac"><div class="hdr"><button class="bk">‹</button><div class="ttl">مركز الأمن</div><div class="sp"></div></div><div class="wr"><div class="itm" onclick="go('p2')"><span class="itm-tx">كلمة سر الدخول</span><span class="itm-ar">▶</span></div><div class="itm" onclick="go('p3')"><span class="itm-tx">كلمة المرور الأمن</span><span class="itm-ar">▶</span></div></div></div><div id="p2" class="pg"><div class="hdr"><button class="bk" onclick="go('p1')">‹</button><div class="ttl">تغيير كلمة المرور</div><div class="sp"></div></div><div class="wr"><div class="frm"><div class="ip-w"><input type="password" class="ip" placeholder="كلمة المرور القديمة لتسجيل الدخول" id="a1"><button class="ey" onclick="tg('a1',this)"><svg viewBox="0 0 24 24"><path d="M12 4.5C7 4.5 2.73 7.61 1 12c1.73 4.39 6 7.5 11 7.5s9.27-3.11 11-7.5c-1.73-4.39-6-7.5-11-7.5zM12 17a5 5 0 1 1 0-10 5 5 0 0 1 0 10zm0-8a3 3 0 1 0 0 6 3 3 0 0 0 0-6z"/></svg></button></div><div class="ip-w"><input type="password" class="ip" placeholder="كلمة المرور الجديدة لتسجيل الدخول" id="a2"><button class="ey" onclick="tg('a2',this)"><svg viewBox="0 0 24 24"><path d="M12 4.5C7 4.5 2.73 7.61 1 12c1.73 4.39 6 7.5 11 7.5s9.27-3.11 11-7.5c-1.73-4.39-6-7.5-11-7.5zM12 17a5 5 0 1 1 0-10 5 5 0 0 1 0 10zm0-8a3 3 0 1 0 0 6 3 3 0 0 0 0-6z"/></svg></button></div><div class="ip-w"><input type="password" class="ip" placeholder="تأكيد كلمة المرور" id="a3"><button class="ey" onclick="tg('a3',this)"><svg viewBox="0 0 24 24"><path d="M12 4.5C7 4.5 2.73 7.61 1 12c1.73 4.39 6 7.5 11 7.5s9.27-3.11 11-7.5c-1.73-4.39-6-7.5-11-7.5zM12 17a5 5 0 1 1 0-10 5 5 0 0 1 0 10zm0-8a3 3 0 1 0 0 6 3 3 0 0 0 0-6z"/></svg></button></div><button class="bt">يتأكد</button></div></div></div><div id="p3" class="pg"><div class="hdr"><button class="bk" onclick="go('p1')">‹</button><div class="ttl">تغيير كلمة المرور الأمنية</div><div class="sp"></div></div><div class="wr"><div class="frm"><div class="ip-w"><input type="password" class="ip" placeholder="كلمة المرور الأمنية القديمة" id="b1"><button class="ey" onclick="tg('b1',this)"><svg viewBox="0 0 24 24"><path d="M12 4.5C7 4.5 2.73 7.61 1 12c1.73 4.39 6 7.5 11 7.5s9.27-3.11 11-7.5c-1.73-4.39-6-7.5-11-7.5zM12 17a5 5 0 1 1 0-10 5 5 0 0 1 0 10zm0-8a3 3 0 1 0 0 6 3 3 0 0 0 0-6z"/></svg></button></div><div class="ip-w"><input type="password" class="ip" placeholder="كلمة المرور الأمنية الجديدة" id="b2"><button class="ey" onclick="tg('b2',this)"><svg viewBox="0 0 24 24"><path d="M12 4.5C7 4.5 2.73 7.61 1 12c1.73 4.39 6 7.5 11 7.5s9.27-3.11 11-7.5c-1.73-4.39-6-7.5-11-7.5zM12 17a5 5 0 1 1 0-10 5 5 0 0 1 0 10zm0-8a3 3 0 1 0 0 6 3 3 0 0 0 0-6z"/></svg></button></div><div class="ip-w"><input type="password" class="ip" placeholder="تأكيد كلمة المرور" id="b3"><button class="ey" onclick="tg('b3',this)"><svg viewBox="0 0 24 24"><path d="M12 4.5C7 4.5 2.73 7.61 1 12c1.73 4.39 6 7.5 11 7.5s9.27-3.11 11-7.5c-1.73-4.39-6-7.5-11-7.5zM12 17a5 5 0 1 1 0-10 5 5 0 0 1 0 10zm0-8a3 3 0 1 0 0 6 3 3 0 0 0 0-6z"/></svg></button></div><button class="bt">يتأكد</button></div></div></div><script>function go(i){document.querySelectorAll('.pg').forEach(p=>p.classList.remove('ac'));document.getElementById(i).classList.add('ac')}function tg(i,b){var p=document.getElementById(i);p.type=p.type==='password'?'text':'password'}</script></body></html>
