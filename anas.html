<!DOCTYPE html><html lang="ar" dir="rtl"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>الدعم</title><link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Arabic:wght@400;500;600&display=swap" rel="stylesheet"><style>*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;font-family:'Noto Sans Arabic',Tahoma,Arial,sans-serif}body{background:#2b1f15;min-height:100vh;color:#fff;direction:rtl}.c{max-width:651px;margin:0 auto;position:relative;min-height:100vh;background:#2b1f15;display:flex;flex-direction:column;height:100vh}.h{display:flex;align-items:center;justify-content:space-between;padding:12px 16px 8px;direction:ltr;background:#2b1f15;border-bottom:1px solid rgba(201,168,118,.15)}.b,.p{background:none;border:none;cursor:pointer;color:#fff;padding:6px;display:flex;align-items:center;justify-content:center}.b svg{width:22px;height:22px}.p{width:38px;height:38px;border-radius:50%;background:linear-gradient(135deg,#6b4423,#4a2f18);border:1.5px solid #c9a876;overflow:hidden}.p svg{width:24px;height:24px}.t{font-size:17px;font-weight:600;flex:1;text-align:center;color:#fff;direction:rtl}.st{display:flex;align-items:center;justify-content:center;gap:6px;padding:8px;background:rgba(0,0,0,.2);direction:rtl}.dot{width:8px;height:8px;border-radius:50%;background:#4ade80;box-shadow:0 0 8px #4ade80;animation:pl 1.5s infinite}.dot.of{background:#fff;box-shadow:none;animation:none}@keyframes pl{0%,100%{opacity:1}50%{opacity:.5}}.stt{font-size:13px;color:#d4c4a8}.ms{flex:1;overflow-y:auto;padding:16px;display:flex;flex-direction:column;gap:10px;direction:rtl}.m{max-width:70%;padding:10px 14px;border-radius:16px;font-size:14px;line-height:1.5;word-wrap:break-word;animation:fi .3s ease}.m.s{align-self:flex-start;background:linear-gradient(135deg,#4ade80,#22c55e);color:#fff;border-bottom-right-radius:4px}.m.r{align-self:flex-end;background:linear-gradient(135deg,#ef4444,#dc2626);color:#fff;border-bottom-left-radius:4px}.m img{max-width:100%;border-radius:10px;display:block}@keyframes fi{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:translateY(0)}}.ib{padding:10px 12px;background:#1f1610;display:flex;align-items:center;gap:8px;direction:rtl;border-top:1px solid rgba(201,168,118,.15)}.inp{flex:1;background:rgba(255,255,255,.08);border:1px solid rgba(201,168,118,.25);border-radius:22px;padding:10px 16px;color:#fff;font-size:14px;outline:none;font-family:inherit}.inp::placeholder{color:#8a7960}.btn{width:42px;height:42px;border-radius:50%;border:none;cursor:pointer;display:flex;align-items:center;justify-content:center;flex-shrink:0;transition:transform .15s}.btn:active{transform:scale(.92)}.bi{background:linear-gradient(135deg,#6b4423,#4a2f18);border:1.5px solid #c9a876}.bs{background:linear-gradient(135deg,#c9a876,#a88656)}.btn svg{width:20px;height:20px}</style></head><body><div class="c"><div class="h"><button class="b" onclick="history.back()" aria-label="back"><svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><polyline points="15 6 9 12 15 18"/></svg></button><div class="t">الدعم</div><button class="p" aria-label="profile"><svg viewBox="0 0 24 24" fill="none" stroke="#f4d9a8" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="8" r="4"/><path d="M4 21c0-4.4 3.6-8 8-8s8 3.6 8 8"/></svg></button></div><div class="st"><span class="dot" id="dot"></span><span class="stt" id="stt">متصل</span></div><div class="ms" id="ms"><div class="m r">مرحباً، كيف يمكنني مساعدتك؟</div><div class="m s">أهلاً، لدي استفسار حول حسابي</div><div class="m r">تفضل بطرح استفسارك</div></div><div class="ib"><button class="btn bi" onclick="document.getElementById('fi').click()" aria-label="image"><svg viewBox="0 0 24 24" fill="none" stroke="#f4d9a8" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="8.5" cy="8.5" r="1.5"/><polyline points="21 15 16 10 5 21"/></svg></button><input type="file" id="fi" accept="image/*" style="display:none" onchange="si(event)"><input type="text" class="inp" id="tx" placeholder="اكتب رسالتك..." onkeypress="if(event.key==='Enter')sm()"><button class="btn bs" onclick="sm()" aria-label="send"><svg viewBox="0 0 24 24" fill="none" stroke="#2b1f15" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><line x1="22" y1="2" x2="11" y2="13"/><polygon points="22 2 15 22 11 13 2 9 22 2" fill="#2b1f15"/></svg></button></div></div><script>function sm(){const t=document.getElementById('tx'),v=t.value.trim();if(!v)return;const m=document.getElementById('ms'),d=document.createElement('div');d.className='m s';d.textContent=v;m.appendChild(d);t.value='';m.scrollTop=m.scrollHeight}function si(e){const f=e.target.files[0];if(!f)return;const r=new FileReader;r.onload=x=>{const m=document.getElementById('ms'),d=document.createElement('div');d.className='m s';d.innerHTML='<img src="'+x.target.result+'">';m.appendChild(d);m.scrollTop=m.scrollHeight};r.readAsDataURL(f);e.target.value=''}setInterval(()=>{const d=document.getElementById('dot'),s=document.getElementById('stt');if(Math.random()>.85){const o=d.classList.toggle('of');s.textContent=o?'غير متصل':'متصل'}},5000)</script></body></html>
