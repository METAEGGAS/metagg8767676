svg{stroke:#f4d9a8}.pfx{color:#e8a34a;font-weight:bold;margin-right:8px;font-size:15px;border-right:1px solid #8b6a45;padding-right:10px}.code{color:#e8a34a;font-weight:bold;font-size:18px;letter-spacing:3px}.rem{display:flex;align-items:center;margin:15px 5px;gap:8px;font-size:14px;color:#c9a878;cursor:pointer}.rem input{appearance:none;width:16px;height:16px;border:1.5px solid #c9a878;border-radius:50%;cursor:pointer;position:relative}.rem input:checked::after{content:"";position:absolute;top:3px;left:3px;width:8px;height:8px;background:#e8a34a;border-radius:50%}.btn{width:100%;background:#e8a34a;border:none;border-radius:15px;padding:18px;color:#3d2817;font-size:18px;font-weight:bold;cursor:pointer;margin-top:10px;letter-spacing:2px}.btn:hover{background:#f0b060}.links{text-align:center;margin-top:15px;font-size:13px;color:#c9a878}.links a{color:#e8a34a;text-decoration:none;font-weight:bold}.links p{margin:8px 0}.hide{display:none}</style></head><body><div class="c"><button class="lang">English</button><div class="logo"><img src="https://i.ibb.co/wNWBxMp3/IMG.png" alt="CRAFTEX"></div><h1 class="title">CRAFTEX</h1><div class="tabs"><div class="tab active" id="tP" onclick="sw('P')">Phone</div><div class="tab" id="tE" onclick="sw('E')">Email</div></div><div class="box"><div id="fL"><div id="fP"><div class="inp"><span class="pfx">+1</span><span style="color:#c9a878">|</span><input type="tel" placeholder="Phone" style="margin-left:10px"></div></div><div id="fE" class="hide"><div class="inp"><input type="email" placeholder="Email"></div></div><div class="inp"><input type="password" placeholder="Password" id="p1"><span class="eye" onclick="tg('p1',this)"><svg viewBox="0 0 24 24"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg></span></div><div id="cP" class="hide"><div class="inp"><input type="password" placeholder="Confirm Password" id="p2"><span class="eye" onclick="tg('p2',this)"><svg viewBox="0 0 24 24"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg></span></div><div class="inp"><span class="code">989396</span></div></div><label class="rem" id="rm"><input type="checkbox"><span>Remember me</span></label><button class="btn" id="bt">Sign In</button><div class="links" id="lk"><p>Don't have an account? <a href="#" onclick="md(1);return false">Sign Up</a></p><p><a href="#">Home</a></p></div></div></div></div><script>let m=0,t='P';function sw(x){t=x;document.getElementById('tE').classList.toggle('active',x=='E');document.getElementById('tP').classList.toggle('active',x=='P');document.getElementById('fE').classList.toggle('hide',x!='E');document.getElementById('fP').classList.toggle('hide',x!='P')}function tg(i,el){let e=document.getElementById(i);if(e.type=='password'){e.type='text';el.innerHTML='<svg viewBox="0 0 24 24"><path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"/><line x1="1" y1="1" x2="23" y2="23"/></svg>'}else{e.type='password';el.innerHTML='<svg viewBox="0 0 24 24"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>'}}function md(x){m=x;document.getElementById('cP').classList.toggle('hide',!x);document.getElementById('rm').classList.toggle('hide',!!x);document.getElementById('bt').textContent=x?'Sign Up':'Sign In';document.getElementById('lk').innerHTML=x?'<p>Already have an account? <a href="#" onclick="md(0);return false">Sign In</a></p>':'<p>Don\'t have an account? <a href="#" onclick="md(1);return false">Sign Up</a></p><p><a href="#">Home</a></p>'}</script></body></html>
