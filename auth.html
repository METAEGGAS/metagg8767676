<!DOCTYPE html>
<html lang="ar" dir="rtl"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>CRAFTEX</title><style>*{margin:0;padding:0;box-sizing:border-box;font-family:'Courier New',monospace}body{min-height:100vh;background:linear-gradient(rgba(0,0,0,.55),rgba(0,0,0,.65)),url('https://i.ibb.co/wNWBxMp3/IMG.png') center/cover no-repeat #2b1d10;display:flex;justify-content:center;align-items:center;padding:20px}.c{width:100%;max-width:400px;color:#f4d9a8;position:relative}.lang{position:absolute;top:0;left:0;background:#6b4a2b;color:#f4d9a8;border:none;padding:8px 16px;border-radius:20px;cursor:pointer;font-size:14px}.lang::before{content:"🌐 "}.logo{width:110px;height:110px;border-radius:50%;background:#1a1208;margin:60px auto 15px;display:flex;justify-content:center;align-items:center;overflow:hidden}.logo img{width:90%;height:90%;object-fit:contain}.title{text-align:center;font-size:32px;color:#f4d9a8;margin-bottom:30px;letter-spacing:2px}.tabs{display:flex;background:#3d2817;border-radius:30px;padding:6px;margin-bottom:20px}.tab{flex:1;padding:12px;text-align:center;border-radius:25px;cursor:pointer;color:#a68968;transition:.3s;font-size:15px}.tab.active{background:#3d2817;border:1px solid #d4a05f;color:#f4d9a8}.box{background:#3d2817;border-radius:20px;padding:25px 20px}.inp{background:#5c3d20;border:none;border-radius:12px;padding:16px 20px;margin-bottom:15px;display:flex;align-items:center;position:relative}.inp input{flex:1;background:transparent;border:none;outline:none;color:#f4d9a8;font-size:15px;text-align:right;direction:rtl}.inp input::placeholder{color:#c9a878}.eye{color:#c9a878;cursor:pointer;font-size:18px}.pfx{color:#e8a34a;font-weight:bold;margin-left:8px;font-size:15px;border-right:1px solid #8b6a45;padding-right:10px}.code{color:#e8a34a;font-weight:bold;font-size:18px;letter-spacing:3px}.rem{display:flex;align-items:center;margin:15px 5px;gap:8px;font-size:14px;color:#c9a878;cursor:pointer;flex-direction:row-reverse;justify-content:flex-end}.rem input{appearance:none;width:16px;height:16px;border:1.5px solid #c9a878;border-radius:50%;cursor:pointer;position:relative}.rem input:checked::after{content:"";position:absolute;top:3px;left:3px;width:8px;height:8px;background:#e8a34a;border-radius:50%}.btn{width:100%;background:#e8a34a;border:none;border-radius:15px;padding:18px;color:#3d2817;font-size:18px;font-weight:bold;cursor:pointer;margin-top:10px;letter-spacing:2px}.btn:hover{background:#f0b060}.links{text-align:center;margin-top:15px;font-size:13px;color:#c9a878}.links a{color:#c9a878;text-decoration:none}.links p{margin:8px 0}.hide{display:none}</style></head><body><div class="c"><button class="lang">عربي</button><div class="logo"><img src="https://i.ibb.co/wNWBxMp3/IMG.png" alt="CRAFTEX"></div><h1 class="title">CRAFTEX</h1><div class="tabs"><div class="tab" id="tE" onclick="sw('E')">بريد إلكتروني</div><div class="tab active" id="tP" onclick="sw('P')">هاتف</div></div><div class="box"><div id="fL"><div id="fP"><div class="inp"><span class="pfx">+1</span><span style="color:#c9a878">|</span><input type="tel" placeholder="هاتف" style="margin-right:10px"></div></div><div id="fE" class="hide"><div class="inp"><input type="email" placeholder="بريد إلكترونى"></div></div><div class="inp"><input type="password" placeholder="كلمة المرور" id="p1"><span class="eye" onclick="tg('p1')">👁</span></div><div id="cP" class="hide"><div class="inp"><input type="password" placeholder="تأكيد كلمة المرور" id="p2"><span class="eye" onclick="tg('p2')">👁</span></div><div class="inp"><span class="code">989396</span></div></div><label class="rem" id="rm"><input type="checkbox"><span>تذكرنى</span></label><button class="btn" id="bt">تسجيل الدخول</button><div class="links" id="lk"><p>ليس لديك حساب؟<a href="#" onclick="md(1);return false">اشتراك</a></p><p><a href="#">بيت</a></p></div></div></div></div><script>let m=0,t='P';function sw(x){t=x;document.getElementById('tE').classList.toggle('active',x=='E');document.getElementById('tP').classList.toggle('active',x=='P');document.getElementById('fE').classList.toggle('hide',x!='E');document.getElementById('fP').classList.toggle('hide',x!='P')}function tg(i){let e=document.getElementById(i);e.type=e.type=='password'?'text':'password'}function md(x){m=x;document.getElementById('cP').classList.toggle('hide',!x);document.getElementById('rm').classList.toggle('hide',!!x);document.getElementById('bt').textContent=x?'اشتراك':'تسجيل الدخول';document.getElementById('lk').innerHTML=x?'<p>هل لديك حساب؟<a href="#" onclick="md(0);return false">تسجيل الدخول</a></p>':'<p>ليس لديك حساب؟<a href="#" onclick="md(1);return false">اشتراك</a></p><p><a href="#">بيت</a></p>'}</script></body></html>
